<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Mitra · Dasaria ERP</title>
<link rel="stylesheet" href="../../assets/css/theme.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark">DA</div>
      <div>
        <div class="name">Dasaria ERP</div>
        <div class="sub">Super User Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-foot">Astryx UI · tema Neutral</div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-crumb"><b>Data Mitra</b></div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="avatar">SU</div>
          Super User Dasaria
        </div>
      </div>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <h1>Data Mitra</h1>
          <p>Kelola seluruh entitas mitra ERP yang terdaftar pada Dasaria.</p>
        </div>
        <button class="btn btn-primary" id="btn-add-mitra">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Tambah Mitra
        </button>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="search" placeholder="Cari kode mitra / nama mitra..." />
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table" id="partner-table">
            <thead>
              <tr>
                <th data-sort="partner_code" class="sortable">Kode Mitra <span class="sort-arrow"></span></th>
                <th data-sort="partner_name" class="sortable">Nama Mitra <span class="sort-arrow"></span></th>
                <th data-sort="address" class="sortable">Alamat <span class="sort-arrow"></span></th>
                <th data-sort="billing_scheme" class="sortable">Skema Pembayaran <span class="sort-arrow"></span></th>
                <th style="width:120px;">Action</th>
              </tr>
            </thead>
            <tbody id="partner-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div id="partner-count"></div>
          <div class="pg-btns"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal Form -->
<div class="modal-overlay" id="modal-form" style="display:none;">
  <div class="modal-box">
    <h3 id="modal-title">Tambah Mitra</h3>
    <form id="form-mitra" style="margin-top:16px;">
      <input type="hidden" id="form-id" />
      <div class="form-field" style="margin-bottom:12px;">
        <label>Kode Mitra</label>
        <input type="text" id="form-code" required placeholder="Contoh: MTR-004" />
      </div>
      <div class="form-field" style="margin-bottom:12px;">
        <label>Nama Mitra</label>
        <input type="text" id="form-name" required placeholder="Contoh: Mitra Baru" />
      </div>
      <div class="form-field" style="margin-bottom:12px;">
        <label>Alamat</label>
        <textarea id="form-address" required rows="3" placeholder="Alamat lengkap..."></textarea>
      </div>
      <div class="form-field" style="margin-bottom:16px;">
        <label>Skema Pembayaran</label>
        <select id="form-scheme" required>
          <option value="Tanggal tetap per bulan">Tanggal tetap per bulan</option>
          <option value="Rentang hari berjalan">Rentang hari berjalan</option>
          <option value="Plus 30 hari">Plus 30 hari</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btn-delete-mitra" style="margin-right:auto;display:none;">Delete</button>
        <button type="button" class="btn btn-ghost" id="btn-cancel-mitra">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/data.js"></script>
<script>
(function () {
  const key = "erp_partners_v1";
  const state = { q: '', sort: 'partner_code', dir: 'asc' };

  function list() { return PartnerDB.getAll(); }
  function save(list) { localStorage.setItem(key, JSON.stringify(list)); }
  function uid() { return ("PTR-" + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6)).toUpperCase(); }

  function openModal(partner) {
    document.getElementById('modal-title').textContent = partner ? 'Edit Mitra' : 'Tambah Mitra';
    document.getElementById('form-id').value = partner?.id || '';
    document.getElementById('form-code').value = partner?.partner_code || '';
    document.getElementById('form-name').value = partner?.partner_name || '';
    document.getElementById('form-address').value = partner?.address || '';
    document.getElementById('form-scheme').value = partner?.billing_scheme || 'Tanggal tetap per bulan';
    document.getElementById('btn-delete-mitra').style.display = partner ? 'inline-flex' : 'none';
    document.getElementById('modal-form').style.display = 'flex';
  }

  function closeModal() { document.getElementById('modal-form').style.display = 'none'; }
  window.closeModal = closeModal;

  function render() {
    let rows = list();
    if (state.q) {
      const q = state.q.toLowerCase();
      rows = rows.filter(p => (p.partner_code + p.partner_name + p.address + p.billing_scheme).toLowerCase().includes(q));
    }

    rows.sort((a, b) => {
      const cmp = String(a[state.sort] || '').localeCompare(String(b[state.sort] || ''));
      return state.dir === 'asc' ? cmp : -cmp;
    });

    document.getElementById('partner-body').innerHTML = rows.length === 0 ? '<tr class="empty-row"><td colspan="5">Tidak ada data mitra</td></tr>' : rows.map(p => `
      <tr>
        <td class="cell-strong">${AppUtils.escapeHtml(p.partner_code)}</td>
        <td>${AppUtils.escapeHtml(p.partner_name)}</td>
        <td>${AppUtils.escapeHtml(p.address)}</td>
        <td>${AppUtils.escapeHtml(p.billing_scheme)}</td>
        <td><button class="btn btn-sm btn-secondary" data-act="edit" data-id="${p.id}">Edit</button></td>
      </tr>
    `).join('');

    document.getElementById('partner-count').textContent = `Menampilkan ${rows.length} mitra`;
    document.querySelectorAll('#partner-table thead th.sortable').forEach(th => {
      th.classList.toggle('sort-active', th.dataset.sort === state.sort);
      th.querySelector('.sort-arrow').textContent = th.dataset.sort === state.sort ? (state.dir === 'asc' ? '↑' : '↓') : '';
    });
  }

  document.getElementById('btn-add-mitra').addEventListener('click', () => openModal());
  document.getElementById('btn-cancel-mitra').addEventListener('click', closeModal);
  document.getElementById('btn-delete-mitra').addEventListener('click', function () {
    const id = document.getElementById('form-id').value;
    if (!id || !confirm('Hapus data mitra ini?')) return;
    save(list().filter(p => p.id !== id));
    closeModal();
    render();
    AppUtils.toast('Data mitra dihapus.', 'success');
  });
  document.getElementById('search').addEventListener('input', function () { state.q = this.value; render(); });
  document.getElementById('modal-form').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

  document.getElementById('partner-body').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-act="edit"]');
    if (!btn) return;
    openModal(list().find(p => p.id === btn.dataset.id));
  });

  document.getElementById('form-mitra').addEventListener('submit', function (e) {
    e.preventDefault();
    const id = document.getElementById('form-id').value;
    const rows = list();
    const data = {
      partner_code: document.getElementById('form-code').value.trim(),
      partner_name: document.getElementById('form-name').value.trim(),
      address: document.getElementById('form-address').value.trim(),
      billing_scheme: document.getElementById('form-scheme').value,
    };

    if (!data.partner_code || !data.partner_name || !data.address) return AppUtils.toast('Lengkapi data mitra.', 'danger');
    if (rows.some(p => p.partner_code === data.partner_code && p.id !== id)) return AppUtils.toast('Kode Mitra sudah digunakan.', 'danger');

    if (id) Object.assign(rows.find(p => p.id === id), data);
    else rows.push({ id: uid(), ...data, company_name: data.partner_name, operational_area: '-', user_count: 0, status: 'Aktif', monthly_revenue: 0, unpaid_invoice_total: 0, active_customers: 0, settlement_status: '-' });

    save(rows);
    closeModal();
    render();
    AppUtils.toast('Data mitra disimpan.', 'success');
  });

  document.querySelectorAll('#partner-table thead th.sortable').forEach(th => {
    th.addEventListener('click', function () {
      const key = this.dataset.sort;
      if (state.sort === key) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort = key; state.dir = 'asc'; }
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
